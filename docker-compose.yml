version: "3.9"

services:
  api:
    build: .
    container_name: classybattle-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
    networks:
      - classybattle-net

  redis:
    image: redis:7-alpine
    container_name: classybattle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - classybattle-net

  db:
    image: postgres:16-alpine
    container_name: classybattle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: classybattle
    ports:
      - "5432:5432"
    volumes:
      - classybattle-db-data:/var/lib/postgresql/data
    networks:
      - classybattle-net

volumes:
  classybattle-db-data:

networks:
  classybattle-net:
    driver: bridge
